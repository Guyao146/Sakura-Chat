# Sakura-Chat —— GHCR 镜像部署（不在本机构建，直接拉取发布镜像）
#
# 启动：  docker compose -f docker-compose.ghcr.yml up -d
# 访问：  http://localhost:3000（宿主机端口由 HOST_PORT 控制）
# 停止：  docker compose -f docker-compose.ghcr.yml down
#
# 与 docker-compose.yml 的区别：镜像来自 ghcr.io/guyao146/sakura-chat（CI 发布），
# 无需源码与构建环境，适合纯部署场景；其余配置一致。
#
# ⚠️ 首次启动会在 sakura-data 卷中生成存储主密钥 key.json。
#    一旦开始聊天，该文件与数据库**必须备份**——丢失将无法解密历史消息！

services:
  sakura-chat:
    image: ghcr.io/guyao146/sakura-chat:latest
    container_name: sakura-chat
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"   # 宿主机端口:容器端口（容器内固定 3000）
    environment:
      - PORT=3000
      - TRUST_PROXY=${TRUST_PROXY:-} # 仅实际代理 IP/CIDR，默认不信任转发头
      # JWT 签名密钥：务必在 .env 或部署环境中注入随机值！
      # 生成：openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:-please-change-me-to-a-long-random-string}
      # 可选：第三方 OIDC 登录（SakuraID / Authentik 等）。不配置则只显示本地登录
      # - OAUTH_SAKURA_ISSUER=https://sso.example.com
      # - OAUTH_SAKURA_CLIENT_ID=app-xxxxxxxxx
      # - OAUTH_SAKURA_CLIENT_SECRET=        # 留空=公开客户端（PKCE）
      # - OAUTH_AUTHENTIK_ISSUER=https://auth.example.com/application/o/sakura-chat
      # - OAUTH_AUTHENTIK_CLIENT_ID=xxxxxxxxxxxxxxxxxxxxxx
      # 反向代理后回调地址与浏览器地址不一致时设置
      # - APP_BASE_URL=https://chat.example.com
      # 可选：挂载 TLS 证书后启用 HTTPS/WSS（把证书放进 server/data 卷）
      # - SSL_KEY_PATH=/app/server/data/key.pem
      # - SSL_CERT_PATH=/app/server/data/cert.pem
    volumes:
      - sakura-data:/app/server/data        # key.json + SQLite（持久化）
      - sakura-uploads:/app/public/uploads  # 图片/语音上传文件
    # 资源限制（按需调整）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

volumes:
  sakura-data:
  sakura-uploads:
