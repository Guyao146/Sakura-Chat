name: Publish Docker Image

# 推送到主分支或打 tag 时，把镜像发布到 GitHub Container Registry（GHCR）。
# 私有仓库的 ghcr 包同样私有，服务器上：
#   echo $GHCR_TOKEN | docker login ghcr.io -u <github用户名> --password-stdin
#   docker pull ghcr.io/<github用户名>/sakura-chat:latest
# 包设为 Public 后无需登录即可拉取（见 docker-compose.ghcr.yml）。

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 要求镜像路径全小写；把 owner/repo 转成小写后输出
      - name: 计算小写镜像名
        id: repo
        run: echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像标签：分支推送 → latest + 完整提交号；git tag（v*）推送 → 附加版本号标签（如 v1.1.0）
      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha,format=long,prefix=

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 匿名拉取冒烟：不携带任何凭据，验证 GHCR 包的 Public 可拉取性
  # （docker-compose.ghcr.yml 直拉部署依赖这一点；若包被改回私有，此步骤会失败）
  verify-anon-pull:
    name: 匿名拉取冒烟（验证 Public 直拉）
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: 计算小写镜像名
        id: repo
        run: echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 匿名拉取本次发布的镜像
        run: docker pull ghcr.io/${{ steps.repo.outputs.image }}:${{ github.sha }}

      - name: 容器健康检查
        run: |
          set -e
          docker run -d --rm --name sakura-ghcr -p 3400:3000 \
            -e JWT_SECRET=ghcr-verify-secret \
            ghcr.io/${{ steps.repo.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3400/api/health > /dev/null; then
              echo "ghcr image healthy after ${i}s"
              docker stop sakura-ghcr
              exit 0
            fi
            sleep 1
          done
          echo "ghcr image unhealthy"
          docker logs sakura-ghcr
          exit 1
